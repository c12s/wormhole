# Base node with the libvirt capability: the VM host. It runs the VM
# reconciler and its own nested VMs. The plain node lives in config.host.yaml.
vmCount: 1
cpus: 4
memory: 4096
nameBase: "node"
backendType: "libvirt"
diskImage: "~/.wormhole/images/edge-base-v4.0.qcow2"
network: "default"
osVariant: "fedora-unknown"   # newest Fedora libvirt knows; only picks virtual hardware
uefi: true
# nested KVM: the guest hosts VMs, so it must see the virtualization extensions
cpuModel: "host-passthrough"
stateDir: "~/.wormhole/libvirt"
# control-plane addresses ship in the OS image (/usr/lib/c12s/node.env);
# set natsAddress only to override them for these nodes
# natsAddress: "192.168.122.1:4222"
ipBase: "192.168.122."
ipOffset: 60                         # first VM -> 192.168.122.61
# guest-side libvirt network for the VMs this node creates (must differ from
# the outer 192.168.122.0/24 the node's own NIC sits on)
vmNetwork: "c12s-vms"
vmIpBase: "192.168.123"
# login user cloud-init creates (omit the block for the default:
# user c12s, password c12s, keys from ~/.ssh/id_*.pub)
# login:
#   user: c12s
#   password: ""                        # "" = no password login, ssh keys only
#   sshKeys: ["~/.ssh/id_ed25519.pub"]  # .pub files or literal keys
